<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>리치 점봉판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Rajdhani:wght@600;700&family=Noto+Serif+KR:wght@700&display=swap">
<style>
:root{
  --ground:#0F1513; --panel:#182220; --panel-2:#1F2C29; --line:#2C3D39; --line-2:#3B524C;
  --ink:#ECE6D6; --ink-2:#B9C2BB; --muted:#7F908A;
  --amber:#F5B342; --amber-2:#B57C1D; --red:#E8553F; --red-2:#B23A2A; --green:#4CB98A;
  --num:'Rajdhani','IBM Plex Sans KR',sans-serif;
  --ui:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;
  --cjk:'Noto Serif KR','IBM Plex Sans KR',serif;
  --W:100vw; --H:100dvh;
  --S:min(var(--W),var(--H));
  --st:clamp(64px,calc(var(--S)/6),600px);
  --sl:var(--st);
  --g:3px;
}
*{box-sizing:border-box}
html,body{background:var(--ground);height:100%}
body{margin:0;color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow:hidden;height:100dvh;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
small{font-size:.8em}

/* ---------- board: pinwheel ---------- */
.board{position:fixed;left:50%;top:50%;width:var(--S);height:var(--S);transform:translate(-50%,-50%)}
.band{position:absolute}
.band.top{left:0;top:0;width:calc(100% - var(--sl));height:var(--st)}
.band.right{right:0;top:0;width:var(--sl);height:calc(100% - var(--st))}
.band.bottom{right:0;bottom:0;width:calc(100% - var(--sl));height:var(--st)}
.band.left{left:0;bottom:0;width:var(--sl);height:calc(100% - var(--st))}
.band.center{left:var(--sl);top:var(--st);right:var(--sl);bottom:var(--st)}
.band.top,.band.bottom{--ch:var(--st)}
.band.left,.band.right{--ch:var(--sl)}
.card{position:absolute;inset:var(--g);background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.band.left .card,.band.right .card{inset:auto;left:50%;top:50%;width:calc(var(--S) - var(--st) - var(--g)*2);height:calc(var(--sl) - var(--g)*2)}
.band.left .card{transform:translate(-50%,-50%) rotate(90deg)}
.band.right .card{transform:translate(-50%,-50%) rotate(-90deg)}
.band.top .card{transform:rotate(180deg)}

/* seat card */
.seat .card{display:flex;align-items:stretch;gap:clamp(6px,3cqw,24px);padding:clamp(8px,3cqw,24px);cursor:pointer;container-type:inline-size}
.seat.dealer .card{border-color:var(--red-2)}
.seat.riichi .card{border-color:var(--amber);background:#241F13;box-shadow:inset 0 0 0 2px var(--amber),0 0 0 3px rgba(245,179,66,.28),0 0 28px rgba(245,179,66,.35)}
.seat.riichi .score{color:#FFD27A}
.seat.riichi .pname{color:var(--ink)}
.who{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,calc(var(--ch)*.06),10px);min-width:0;flex:0 0 clamp(48px,18cqw,280px);text-align:center}
.wind{font-family:var(--cjk);font-size:min(clamp(18px,calc(var(--ch)*.22),64px),7.5cqw);line-height:1;color:var(--ink-2);align-self:center;padding:.22em .32em;border-radius:9px;border:1px solid var(--line)}
.seat.dealer .wind{color:#fff;background:var(--red);border-color:var(--red)}
.pname{font-weight:600;font-size:min(clamp(11px,calc(var(--ch)*.13),36px),4.5cqw);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);max-width:100%}
.scorebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;position:relative;overflow:hidden}
.score{font-family:var(--num);font-weight:700;font-size:min(clamp(26px,calc(var(--ch)*.42),170px),12cqw);white-space:nowrap;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.score.neg{color:var(--red)}
.flash{position:absolute;left:0;right:0;bottom:4%;text-align:center;font-family:var(--num);font-weight:600;font-size:min(clamp(11px,calc(var(--ch)*.14),44px),4.5cqw);line-height:1;height:1em;color:var(--muted);font-variant-numeric:tabular-nums;transition:opacity .4s}
.flash.up{color:var(--green)}.flash.down{color:var(--red)}
.tip{margin-top:clamp(1px,calc(var(--ch)*.02),4px);text-align:center;font-size:min(clamp(9px,calc(var(--ch)*.09),22px),3.4cqw);line-height:1;color:var(--muted);opacity:.55;letter-spacing:.04em;white-space:nowrap;pointer-events:none}
@container (max-width:300px){.tip{display:none}}
.rbtn{flex:0 0 clamp(60px,34cqw,340px);border-radius:14px;border:1px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(5px,calc(var(--ch)*.07),12px);font-size:min(calc(var(--ch)*.3),10.5cqw);font-weight:700;color:var(--ink-2);letter-spacing:.04em;line-height:1;transition:transform .08s;padding:6px 8px}
.rbtn:not(.on){color:rgba(185,194,187,.5)}
.rbtn:not(.on) .stick{background:rgba(59,82,76,.6)}
.rbtn:active{transform:scale(.97)}
.rbtn .stick{width:78%;height:clamp(8px,calc(var(--ch)*.1),28px);border-radius:14px;background:var(--line-2);position:relative}
.rbtn.on{background:var(--amber);border-color:var(--amber);color:#1a1408;font-weight:700}
.rbtn.on .stick{background:#FFFBF2;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.rbtn.on .stick::after{content:'';position:absolute;left:50%;top:50%;height:68%;aspect-ratio:1/1;width:auto;border-radius:50%;background:var(--red);transform:translate(-50%,-50%)}
.rbtn:disabled{opacity:.35}

/* center card */
.center .card{background:transparent;border:0;border-radius:0;overflow:visible}
.c-in{position:absolute;inset:0;display:flex;flex-direction:column;padding:0;container-type:inline-size}
.center.r180 .c-in{transform:rotate(180deg)}
.center.r90 .c-in,.center.r270 .c-in{inset:auto;left:50%;top:50%;width:calc(var(--H) - var(--st)*2 - var(--g)*4);height:calc(var(--W) - var(--sl)*2 - var(--g)*4)}
.center.r90 .c-in{transform:translate(-50%,-50%) rotate(90deg)}
.center.r270 .c-in{transform:translate(-50%,-50%) rotate(-90deg)}
#layer{position:fixed;left:50%;top:50%;z-index:20;transform:translate(-50%,-50%)}
#layer:empty,#layer[hidden]{display:none}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:11px;letter-spacing:.08em;padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.tag.hot{border-color:var(--red);color:var(--red)}
.more{width:36px;height:36px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);font-size:22px;line-height:1;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.c-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0;text-align:center}
.round{font-family:var(--cjk);font-size:clamp(15px,min(30cqw,30cqh),130px);line-height:1;white-space:nowrap}
.round b{font-family:var(--num);font-weight:700;font-size:1.2em;color:var(--amber);margin:0 3px;font-variant-numeric:tabular-nums}
.sub{display:flex;gap:14px;color:var(--ink-2);font-size:clamp(12px,2.4vmin,16px)}
.sub b{font-family:var(--num);font-size:1.35em;color:var(--ink);font-variant-numeric:tabular-nums}
.primary{width:100%;padding:16px 10px;border-radius:14px;background:var(--amber);color:#1a1408;font-weight:600;font-size:18px;border:1px solid var(--amber)}
.primary:disabled{opacity:.4}
.primary.warn{background:var(--red);border-color:var(--red);color:#fff}
.pw{position:relative;flex:1;min-height:0;--t:calc(min(100cqw,100cqh)/4);--tw:var(--t);--th:var(--t);--pg:6px;--gd:4.3px;container-type:size}
.pwb{position:absolute;touch-action:none;-webkit-touch-callout:none;background:var(--amber);border:0;color:#1a1408;border-radius:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(22px,min(14cqw,14cqh),130px);transition:filter .08s;overflow:hidden}
.pwb:active{filter:brightness(.9)}
.pwb:disabled{opacity:.4}
.pwb .lab{display:flex;flex-direction:column;align-items:center;gap:.12em;line-height:1;white-space:nowrap}
.pwb small{font-size:.36em;font-weight:600;opacity:.75;letter-spacing:.02em}
.pwb.top{left:0;top:0;width:100%;height:var(--t);clip-path:polygon(var(--gd) 0,calc(100% - var(--gd)) 0,calc(100% - var(--t) - var(--gd)) 100%,calc(var(--t) + var(--gd)) 100%)}
.pwb.top .lab{transform:rotate(180deg)}
.pwb.right{right:0;top:0;width:var(--t);height:100%;clip-path:polygon(100% var(--gd),100% calc(100% - var(--gd)),0 calc(100% - var(--t) - var(--gd)),0 calc(var(--t) + var(--gd)))}
.pwb.right .lab{transform:rotate(-90deg)}
.pwb.bottom{left:0;bottom:0;width:100%;height:var(--t);clip-path:polygon(calc(var(--t) + var(--gd)) 0,calc(100% - var(--t) - var(--gd)) 0,calc(100% - var(--gd)) 100%,var(--gd) 100%)}
.pwb.left{left:0;top:0;width:var(--t);height:100%;clip-path:polygon(0 var(--gd),100% calc(var(--t) + var(--gd)),100% calc(100% - var(--t) - var(--gd)),0 calc(100% - var(--gd)))}
.pwb.left .lab{transform:rotate(90deg)}
.pwb:focus-visible{outline:none;filter:brightness(1.1)}
.pwm{position:absolute;left:calc(var(--tw) + var(--pg));top:calc(var(--th) + var(--pg));right:calc(var(--tw) + var(--pg));bottom:calc(var(--th) + var(--pg));display:flex;flex-direction:column;gap:var(--pg)}
.pwm{container-type:size}
.pwm-top,.pwm-bot{flex:1;min-height:0;border-radius:14px;border:1px solid var(--line-2);background:var(--panel);display:flex;align-items:center;justify-content:center;color:rgba(185,194,187,.3);font-size:min(36cqw,44cqh);font-weight:800;overflow:hidden;padding:0 4%;line-height:1}
.pwm-top span,.pwm-bot span{display:flex;justify-content:space-between;width:100%}
.pwm-top{color:rgba(232,85,63,.5);background:rgba(232,85,63,.09);border-color:rgba(232,85,63,.45)}
.pwm-top:active{background:rgba(232,85,63,.12)}
.pwm-top i,.pwm-bot i{font-style:normal}
.pwc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(58cqw,58cqh);height:min(58cqw,58cqh);border-radius:50%;background:var(--panel-2);border:1px solid var(--line-2);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(2px,3cqh,8px);pointer-events:none;color:var(--ink);container-type:size;padding:6%}
.pwc .tag{margin-bottom:1px}
.pwm-top:active,.pwm-bot:active{background:var(--panel-2)}
.pwm-top:disabled{opacity:.4}
.burger{display:inline-flex;flex-direction:column;gap:3px;width:16px}
.burger i{display:block;height:2px;border-radius:1px;background:currentColor}
/* drag-to-assign overlay */
.wover{position:fixed;inset:0;z-index:45;background:rgba(6,10,9,.82)}
.wzone{position:fixed;border-radius:16px;border:2px solid var(--line-2);background:rgba(31,44,41,.9);display:flex;align-items:center;justify-content:center;color:var(--ink);transition:background .1s,box-shadow .1s,border-color .1s}
.wzone .zl{display:flex;flex-direction:column;align-items:center;gap:6px;line-height:1;white-space:nowrap}
.wzone .zl b{font-weight:700;font-size:clamp(20px,5vmin,40px);letter-spacing:.12em}
.wzone .zl span{font-size:clamp(13px,2.6vmin,18px);font-weight:600;color:var(--ink-2)}
.wzone.hov{background:var(--amber);border-color:#FFE2A8;color:#1a1408;box-shadow:0 0 0 4px rgba(245,179,66,.35),0 0 48px 8px rgba(245,179,66,.55)}
.wzone.hov .zl span{color:#1a1408;opacity:.75}
.wzone.me{border-color:var(--amber-2)}
.wzone.center{border-style:dashed;color:var(--ink-2)}
.wzone.center .zl b{font-size:clamp(16px,3.5vmin,26px)}
.dghost{position:fixed;z-index:50;pointer-events:none;background:var(--amber);color:#1a1408;font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;box-shadow:0 8px 20px rgba(0,0,0,.45);transform:translate(-50%,-140%);white-space:nowrap}
.sticks{display:flex;flex-direction:column;gap:0;align-items:center;margin-top:-2px}
.stkrow{display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;gap:3px;line-height:1;margin:-1px 0;font-size:clamp(10px,min(11cqw,12cqh),32px);color:var(--ink-2)}
.stkrow b{font-family:var(--num);font-size:1.35em;color:var(--ink);min-width:1.6em;text-align:left;font-variant-numeric:tabular-nums;margin-left:3px}
.stk{display:block;width:clamp(22px,min(26cqw,30cqh),110px);height:auto;filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}
.stk.dim{opacity:.3}
@container (max-height:110px){.pwc .tag{display:none}}

/* ---------- dock mode: when the viewport is clearly wider or taller than square, 유국/메뉴 leave the board ---------- */
#dock{display:none;--dkw:min(calc((var(--W) - var(--S))/2 - var(--g)*2),calc(var(--S)*.5));--dkh:min(calc((var(--H) - var(--S))/2 - var(--g)*2),calc(var(--S)*.5))}
.dk{position:fixed;z-index:10;border-radius:14px;border:1px solid var(--line-2);background:var(--panel);color:rgba(185,194,187,.3);font-weight:800;line-height:1;display:flex;align-items:center;justify-content:center;overflow:hidden;container-type:size;padding:0}
.dk span{display:flex;justify-content:center;align-items:center;gap:.3em;width:100%;height:100%}
.dk i{font-style:normal}
.dk:active{background:var(--panel-2)}
.dk.dk-draw{color:rgba(232,85,63,.5);background:rgba(232,85,63,.09);border-color:rgba(232,85,63,.45)}
.dk.dk-draw:active{background:rgba(232,85,63,.12)}
.dk:disabled{opacity:.4}
@media (min-aspect-ratio:13/10),(max-aspect-ratio:10/13){
  :root{--st:clamp(64px,calc(var(--S)/5),600px);--sl:var(--st)}
  .pw{--t:calc(min(100cqw,100cqh)/2)}
  .pwb{font-size:clamp(22px,min(15cqw,15cqh),130px)}
  .pwb.bottom .lab{transform:translateY(9cqh)}
  .pwb.top .lab{transform:rotate(180deg) translateY(9cqh)}
  .pwb.left .lab{transform:rotate(90deg) translateY(9cqw)}
  .pwb.right .lab{transform:rotate(-90deg) translateY(9cqw)}
  .pwm{left:0;top:0;right:0;bottom:0;pointer-events:none}
  .pwm-top,.pwm-bot{display:none}
  .pwc{width:min(36cqw,36cqh);height:min(36cqw,36cqh)}
  #dock{display:block}
}
@media (min-aspect-ratio:13/10){
  .dk{top:50%;transform:translateY(-50%);width:var(--dkw);height:calc(var(--S) - var(--g)*2)}
  .dk span{font-size:min(68cqw,26cqh)}
  .dk span{flex-direction:column}
  .dk.dk-draw{left:calc(50% - var(--S)/2 - var(--g) - var(--dkw))}
  .dk.dk-menu{left:calc(50% + var(--S)/2 + var(--g))}
}
@media (max-aspect-ratio:10/13){
  .dk{left:50%;transform:translateX(-50%);height:var(--dkh);width:calc(var(--S) - var(--g)*2)}
  .dk span{font-size:min(60cqh,20cqw)}
  .dk span{flex-direction:row}
  .dk.dk-draw{top:calc(50% - var(--S)/2 - var(--g) - var(--dkh))}
  .dk.dk-menu{top:calc(50% + var(--S)/2 + var(--g))}
}

/* ---------- POV overlay ---------- */
.pov{position:absolute;inset:0;background:rgba(15,21,19,.985);z-index:30;cursor:pointer}
.pov-in{position:absolute;left:50%;top:50%;display:flex;align-items:center;justify-content:center}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:calc(var(--cell)*.06)}
.pv{border:1px solid var(--line);border-radius:calc(var(--cell)*.1);padding:calc(var(--cell)*.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cell)*.04);text-align:center;background:var(--panel);min-width:0;min-height:0}
.pv .rel{font-size:calc(var(--cell)*.085);letter-spacing:.1em;color:var(--muted);line-height:1}
.pv .nm{font-size:calc(var(--cell)*.1);font-weight:600;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
.pv .df{font-family:var(--num);font-weight:700;font-size:calc(var(--cell)*.3);line-height:1;font-variant-numeric:tabular-nums;margin:calc(var(--cell)*.02) 0}
.pv .df.up{color:var(--green)}.pv .df.down{color:var(--red)}.pv .df.zero{color:var(--muted)}
.pv .sc{font-family:var(--num);font-weight:600;font-size:calc(var(--cell)*.11);color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.pv.toimen{grid-area:1/2}.pv.kami{grid-area:2/1}.pv.shimo{grid-area:2/3}.pv.me{grid-area:3/2}
.pv.me{background:var(--panel-2);border-color:var(--amber-2)}
.pv.me .rel,.pv.me .nm{color:var(--ink)}
.pv.me .df{color:var(--amber)}
.pv.mid{grid-area:2/2;background:transparent;border-color:transparent}
.pv.mid .rk{font-family:var(--num);font-weight:700;font-size:calc(var(--cell)*.36);line-height:1;color:var(--ink)}
.pv.mid .rk small{font-family:var(--ui);font-size:.32em;font-weight:600;color:var(--ink-2);margin-left:3px}
.pv.mid .rd{font-family:var(--cjk);font-size:calc(var(--cell)*.11);color:var(--muted);line-height:1.2}
.pv.mid .hint{font-size:calc(var(--cell)*.07);color:var(--muted);margin-top:calc(var(--cell)*.04)}
.seat .card{touch-action:none;-webkit-touch-callout:none}

/* ---------- full sheets (wizard, menus) ---------- */
.full{position:absolute;inset:0;background:var(--ground);z-index:20;display:flex;flex-direction:column}
.f-head{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;padding-top:calc(14px + env(safe-area-inset-top))}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:20px;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.f-title{flex:1;font-size:18px;font-weight:600}
.f-head.center{justify-content:center;position:relative;padding:20px 60px 4px}
.f-head.center .f-title{flex:none;font-size:22px;text-align:center;letter-spacing:.02em}
.xbtn{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink-2);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}
.f-q.center{text-align:center;font-size:16px;color:var(--ink);padding:4px 16px 16px}
.f-q .qbig{display:block;font-size:clamp(20px,5.5vmin,28px);font-weight:700;color:var(--ink);line-height:1.3;letter-spacing:.01em}
.f-q .qbig i{font-style:normal;color:var(--amber);margin:0 .25em}
.f-q .qbig small{display:block;font-size:.6em;font-weight:500;color:var(--muted);margin-top:2px}
.pays{display:flex;flex-direction:column;gap:8px}
.pay{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);min-height:56px}
.pay .from{text-align:right;font-weight:700;font-size:clamp(17px,4vmin,22px);color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay .from.multi{font-size:clamp(14px,3.2vmin,17px);white-space:normal;line-height:1.25;text-overflow:clip}
.pay .from .dot{color:var(--muted);margin:0 .3em;font-weight:500}
.pay .to{text-align:left;font-weight:700;font-size:clamp(17px,4vmin,22px);color:var(--amber);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay .mid{display:flex;flex-direction:column;align-items:center;line-height:1;gap:3px}
.pay .amt{display:flex;align-items:center;gap:6px}
.pay .mid b{font-family:var(--num);font-weight:700;font-size:clamp(22px,5.5vmin,28px);color:var(--ink);font-variant-numeric:tabular-nums}

<script>
(function(){
const WINDS=['東','南','西','北'];
const KEY='riichi-tenbou-v4';
const DEFAULT_NAMES=['조조','리지','쟝쟝','후후'];
const OLD_DEFAULTS=['동','남','서','북'];
const isDefaultName=(n,i)=>n===DEFAULT_NAMES[i]||n===OLD_DEFAULTS[i];
const SERIES=['#3987e5','#d95926','#2fa36b','#b862d6'];
const UMA={none:[0,0,0,0],'5-10':[10,5,-5,-10],'10-20':[20,10,-10,-20],'10-30':[30,10,-10,-30]};
const RON_KO=[1000,1300,1600,2000,2600,3200,3900,5200,6400,7700,8000,12000,16000,24000,32000,48000];
const RON_OYA=[1500,2000,2400,2900,3900,4800,5800,7700,9600,11600,12000,18000,24000,36000,48000];
const TSUMO_KO=[[300,500],[400,700],[500,1000],[700,1300],[800,1600],[1000,2000],[1300,2600],[1600,3200],[2000,4000],[3000,6000],[4000,8000],[6000,12000],[8000,16000]];
const TSUMO_OYA=[500,700,800,1000,1300,1600,2000,2600,3200,4000,6000,8000,12000,16000];
const LIMITS=[['만관',5],['하네만',6],['배만',8],['삼배만',11],['역만',13],['더블역만',26],['트리플역만',39],['4배역만',52]];
const FUS=[20,25,30,40,50,60,70,80,90,100,110];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sgn=n=>n>0?'+'+n:n<0?'-'+Math.abs(n):'0';
const cls=n=>n>0?'up':n<0?'down':'zero';
const up100=x=>Math.ceil(x/100)*100;

let S=null,F=null,D=null,M=null,U=null,flash=null,flashT=null,toastT=null,povSeat=null,press=null,chartState=null;
const HOLD_MS=320;
const SEAT_ROT=[0,-90,180,90];
const POS_CLASS=['bottom','right','top','left'];
const posOf=i=>(i-dealer()+4)%4;
function setLayerRot(rot){const L=$('#layer');L.hidden=false;const sw=Math.abs(rot)===90;const w=sw?innerHeight:innerWidth,h=sw?innerWidth:innerHeight;L.style.width=w+'px';L.style.height=h+'px';L.style.transform=`translate(-50%,-50%) rotate(${rot}deg)`}

function defaultSettings(){return {length:'han',start:25000,oka:30000,uma:'10-20',tobi:true,finalCalc:true}}
function newGame(names,settings){return {players:names.map(n=>({name:n,score:settings.start,riichi:false})),roundWind:0,kyoku:1,honba:0,kyotaku:0,log:[],settings,ended:false,setup:false,started:Date.now()}}
const dealer=()=>(S.kyoku-1)%4;
const lastWind=()=>S.settings.length==='ton'?0:1;
const isOorasu=()=>!S.ended&&S.roundWind===lastWind()&&S.kyoku===4;
const roundLabel=()=>`${WINDS[S.roundWind]}${S.kyoku}局`+(S.honba?` ${S.honba}본장`:'');
const shortRound=()=>`${WINDS[S.roundWind]}${S.kyoku}`;
const others=w=>[0,1,2,3].filter(i=>i!==w);
const name=i=>S.players[i].name;
const seatWind=i=>WINDS[(i-dealer()+4)%4];
const isDealerWinner=f=>f.winner===dealer();

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.players&&o.players.length===4){o.settings=Object.assign(defaultSettings(),o.settings||{});o.players.forEach((pl,i)=>{if(pl.name===OLD_DEFAULTS[i])pl.name=DEFAULT_NAMES[i]});return o}}}catch(e){}return null}
function log(text,deltas,kind){S.log.push({round:roundLabel(),sr:shortRound(),text,kind:kind||'info',deltas:deltas?deltas.slice():null,scores:S.players.map(p=>p.score)})}
function apply(deltas){S.players.forEach((p,i)=>{p.score+=deltas[i]})}
function advance(){S.kyoku++;if(S.kyoku>4){S.kyoku=1;S.roundWind++}}
function showFlash(deltas){clearTimeout(flashT);flash=deltas;flashT=setTimeout(()=>{flash=null;render()},4000)}
function afterHand(){
  if(S.roundWind>lastWind()){S.ended=true;S.roundWind=lastWind();S.kyoku=4;log('반장 종료',null,'info')}
  else if(S.settings.tobi&&S.players.some(p=>p.score<0)){S.ended=true;log('토비 종료',null,'info')}
  save();render();
  if(S.ended)openSettle();
}
function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200)}

/* ---- core actions ---- */
function doRiichi(i){
  if(S.ended)return;
  const p=S.players[i];
  if(!p.riichi&&p.score<1000){toast('1000점 미만이라 리치를 걸 수 없습니다');return}
  const d=[0,0,0,0];
  if(p.riichi){p.riichi=false;p.score+=1000;S.kyotaku--;d[i]=1000;log(`${p.name} 리치 취소`,d,'riichi')}
  else{p.riichi=true;p.score-=1000;S.kyotaku++;d[i]=-1000;log(`${p.name} 리치`,d,'riichi')}
  save();render();
}
function computeWin(f,withK){
  const d=dealer(),hb=S.honba,k=withK?S.kyotaku:0,deltas=[0,0,0,0];
  if(f.winner==null)return{ok:false,deltas};
  if(f.type==='ron'){
    if(f.loser==null||f.loser===f.winner)return{ok:false,deltas};
    const base=+f.base||0;if(base<=0)return{ok:false,deltas};
    const amt=base+hb*300;deltas[f.winner]+=amt+k*1000;deltas[f.loser]-=amt;
    return{ok:true,deltas,honba:hb*300,base:String(base)};
  }
  const a=+f.a||0,b=+f.b||0;
  if(a<=0||(f.winner!==d&&b<=0))return{ok:false,deltas};
  let total=0;
  others(f.winner).forEach(o=>{const pay=(f.winner===d?a:(o===d?b:a))+hb*100;deltas[o]-=pay;total+=pay});
  deltas[f.winner]+=total+k*1000;
  return{ok:true,deltas,honba:hb*100*3,base:f.winner===d?a+' 올':a+' / '+b};
}
function computeHand(wins){
  const deltas=[0,0,0,0];let ok=true;const parts=[];
  wins.forEach(w=>{const r=computeWin(w,false);if(!r.ok){ok=false;return}r.deltas.forEach((v,i)=>deltas[i]+=v);parts.push(r)});
  if(!ok||!wins.length)return{ok:false,deltas};
  let rec=wins[0].winner;
  if(wins.length>1){const L=wins[0].loser;rec=wins.map(w=>w.winner).sort((a,b)=>((a-L+4)%4)-((b-L+4)%4))[0]}
  deltas[rec]+=S.kyotaku*1000;
  return{ok:true,deltas,rec,kyotaku:S.kyotaku*1000,parts};
}
function doHand(wins){
  const r=computeHand(wins);if(!r.ok){toast('입력이 완료되지 않았습니다');return false}
  const d=dealer();apply(r.deltas);
  const desc=wins.map(w=>`${name(w.winner)} ${w.type==='ron'?'론 ← '+name(w.loser):'쯔모'}${w.label?' · '+w.label:''}`).join(' + ');
  log((wins.length===2?'더블론 · ':wins.length===3?'트리플론 · ':'')+desc,r.deltas,'hand');
  S.kyotaku=0;S.players.forEach(p=>p.riichi=false);
  if(wins.some(w=>w.winner===d))S.honba++;else{S.honba=0;advance()}
  showFlash(r.deltas);afterHand();return true;
}
function doDraw(dr){
  const d=dealer();const deltas=[0,0,0,0];
  if(!dr.abortive){
    const n=dr.tenpai.filter(Boolean).length;
    if(n>0&&n<4){const gain=3000/n,loss=3000/(4-n);dr.tenpai.forEach((t,i)=>deltas[i]=t?gain:-loss)}
    apply(deltas);
    const tn=S.players.filter((p,i)=>dr.tenpai[i]).map(p=>p.name);
    log(`유국 · ${tn.length?'텐파이 '+tn.join(', '):'전원 노텐'}`,deltas,'hand');
    if(n>0&&n<4)showFlash(deltas);
  }else log('도중 유국',null,'hand');
  S.players.forEach(p=>p.riichi=false);
  S.honba++;
  if(!dr.abortive&&!dr.tenpai[d])advance();
  afterHand();
}

/* ---- win wizard ---- */
const STEPS=f=>f.pending.length?['winner','points','confirm']:(f.type==='tsumo'?['winner','type','points','confirm']:['winner','type','loser','points','confirm']);
function openWin(){F={step:'winner',winner:null,type:null,loser:null,han:0,fu:30,limit:null,base:'',a:'',b:'',tab:'quick',pending:[]};renderWin()}
function stepInfo(){const s=STEPS(F);const i=s.indexOf(F.step);return{n:s.length,i:i+1,prev:s[i-1]}}
function basePoints(han,fu){if(han>=52)return 32000;if(han>=39)return 24000;if(han>=26)return 16000;if(han>=13)return 8000;if(han>=11)return 6000;if(han>=8)return 4000;if(han>=6)return 3000;if(han>=5)return 2000;return Math.min(fu*Math.pow(2,han+2),2000)}
function autofill(){if(!F.han)return;const b=basePoints(F.han,F.fu),oya=isDealerWinner(F);if(F.type==='ron')F.base=oya?up100(b*6):up100(b*4);else if(oya){F.a=up100(b*2);F.b=''}else{F.a=up100(b);F.b=up100(b*2)}}
function winLabel(){return F.han?(F.limit||`${F.han}판 ${F.fu}부`):''}
function entryOf(){return{winner:F.winner,type:F.type,loser:F.loser,base:F.base,a:F.a,b:F.b,label:winLabel()}}
function seatBtn(i,act,on,dis){return`<button class="bopt ${on?'on':''} ${i===dealer()?'dealer':''}" data-act="${act}" data-v="${i}" ${dis?'disabled':''}><span class="wind">${seatWind(i)}</span><span>${esc(name(i))}</span><span class="sub2">${S.players[i].score}</span></button>`}

  }else if(F.step==='type'){
    full(title,`<div class="big c1" style="flex:1"><button class="bopt tall ${F.type==='ron'?'on':''}" data-act="w-type" data-v="ron">론<small>다른 사람의 버림패로</small></button><button class="bopt tall ${F.type==='tsumo'?'on':''}" data-act="w-type" data-v="tsumo">쯔모<small>직접 뽑아서</small></button></div>`,null,Object.assign(opts,{q:`<b class="qbig">${esc(name(F.winner))}의 화료<small>어떻게 났나요?</small></b>`,nav:nav(!F.type)}));

      else body+=`<div class="lbl"><span>子 / 親 지불</span></div><div class="chips" style="grid-template-columns:repeat(3,1fr)">${TSUMO_KO.map(([a,b])=>`<button class="chip ${selA(a,b)}" data-act="w-quick" data-v="${a}" data-b="${b}">${a}<small> / </small>${b}</button>`).join('')}</div>`;

        Object.keys(g).map(Number).sort((a,b)=>b-a).forEach(pay=>pays.push({from:g[pay],to:w.winner,amt:pay,label:[g[pay].length>1?'각자':'',hb?`본장 +${hb*100}`:''].filter(Boolean).join(' · ')}))}});
      if(S.kyotaku)pays.push({from:null,to:r.rec,amt:S.kyotaku*1000,label:`리치봉 ${S.kyotaku}개`})}
    const payHtml=pays.map(p=>`<div class="pay ${p.from==null?'k':''}"><span class="from ${p.from&&p.from.length>1?'multi':''}">${p.from==null?'공탁':p.from.map(i=>esc(name(i))).join('<span class="dot">·</span>')}</span><span class="mid"><span class="amt"><b>${p.amt}</b><i>→</i></span>${p.label?`<small>${p.label}</small>`:''}</span><span class="to">${esc(name(p.to))}</span></div>`).join('');

function refreshOrderWinds(list){}
let drag=null;
document.addEventListener('pointerdown',e=>{
  const grip=e.target.closest('.grip');if(!grip)return;const row=grip.closest('.orow');if(!row)return;
  const list=row.parentElement;const rows=[...list.children];
  try{grip.setPointerCapture(e.pointerId)}catch(_){}

  row.classList.add('drag');e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dy=e.clientY-drag.startY;const rows=[...drag.list.children];const i=rows.indexOf(drag.row);
  if(dy>drag.rowH*0.6&&i<rows.length-1){drag.list.insertBefore(rows[i+1],drag.row);drag.startY+=drag.rowH;drag.moved=dy-drag.rowH}
  else if(dy<-drag.rowH*0.6&&i>0){drag.list.insertBefore(drag.row,rows[i-1]);drag.startY-=drag.rowH;drag.moved=dy+drag.rowH}
  else drag.moved=dy;
  drag.row.style.transform=`translateY(${drag.moved}px)`;
  refreshOrderWinds(drag.list);

function endDrag(){
  if(!drag)return;drag.row.style.transform='';drag.row.classList.remove('drag');

function initM(){M={roundWind:S.roundWind,kyoku:S.kyoku,settings:Object.assign({},S.settings),locked:new Set(),order:[0,1,2,3]}}
function updateManualSum(){
  const L=$('#layer');const el=L.querySelector('#mSum');if(!el)return;
  const inputs=[...L.querySelectorAll('[data-mp]')];
  const k=+(L.querySelector('[data-mi="kyotaku"]')||{value:0}).value||0;
  if(M&&M.locked&&M.locked.size>0&&M.locked.size<4){
    const free=inputs.filter(inp=>!M.locked.has(+inp.dataset.mp));
    let rest=S.settings.start*4-k*1000;inputs.forEach(inp=>{if(M.locked.has(+inp.dataset.mp))rest-=(+inp.value||0)});
    const each=Math.floor(rest/free.length/100)*100;

  }
  let sum=0;inputs.forEach(inp=>sum+=(+inp.value||0));
  const total=sum+k*1000,expect=S.settings.start*4;
  el.innerHTML=total===expect?`합계 ${total} ✓`:`<span style="color:var(--red)">합계 ${total} (기준 ${expect}, 차이 ${sgn(total-expect)})</span>`;
  const btn=L.querySelector('[data-act="c-start"],[data-act="settings-save"]');
  if(btn){const bad=total!==expect;btn.classList.toggle('warn',bad);const base=btn.dataset.act==='c-start'?'이 상황으로 시작':'저장';btn.textContent=bad?`합계 ${sgn(total-expect)} · 그래도 ${base}`:base}
}
function applyStateFields(){
  const L=$('#layer');const before=S.players.map(p=>p.score);

/* ---- log + chart ---- */
function chartSeries(){
  const pts=[];const startScores=S.players.map(()=>S.settings.start);
  const first=S.log[0];
  if(first&&first.kind==='start'){pts.push({label:'시작',scores:first.scores})}else pts.push({label:'시작',scores:startScores});
  S.log.forEach(e=>{if(e.kind==='hand'||e.kind==='manual')pts.push({label:e.sr,scores:e.scores})});
  return pts;
}
function drawChart(cv,pts,hover){
  const dpr=Math.min(2,window.devicePixelRatio||1);

  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.height=h+'px';
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);

function paintChart(ctx,w,h,pts,hover,bg){

  const n=pts.length;const x=i=>padL+(n>1?(w-padL-padR)*i/(n-1):(w-padL-padR)/2);const y=v=>padT+(h-padT-padB)*(1-(v-lo)/(hi-lo));
  ctx.font='12px "IBM Plex Sans KR",system-ui,sans-serif';ctx.textBaseline='middle';
  for(let v=lo;v<=hi;v+=step){ctx.strokeStyle='rgba(185,194,187,.14)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(padL,y(v));ctx.lineTo(w-padR,y(v));ctx.stroke();ctx.fillStyle='#7F908A';ctx.textAlign='right';ctx.fillText(String(v/1000)+'k',padL-8,y(v))}
  const s0=S.settings.start;if(s0>lo&&s0<hi){ctx.setLineDash([3,4]);ctx.strokeStyle='rgba(236,230,214,.35)';ctx.beginPath();ctx.moveTo(padL,y(s0));ctx.lineTo(w-padR,y(s0));ctx.stroke();ctx.setLineDash([])}
  ctx.textAlign='center';ctx.fillStyle='#7F908A';const every=Math.max(1,Math.ceil(n/8));
  pts.forEach((p,i)=>{if(i%every===0||i===n-1)ctx.fillText(p.label,x(i),h-padB/2)});
  if(hover!=null){ctx.strokeStyle='rgba(236,230,214,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x(hover),padT);ctx.lineTo(x(hover),h-padB);ctx.stroke()}
  S.players.forEach((p,k)=>{
    ctx.strokeStyle=SERIES[k];ctx.lineWidth=2;ctx.lineJoin='round';ctx.beginPath();
    pts.forEach((pt,i)=>{i?ctx.lineTo(x(i),y(pt.scores[k])):ctx.moveTo(x(i),y(pt.scores[k]))});ctx.stroke();
    const li=n-1;ctx.fillStyle=SERIES[k];ctx.beginPath();ctx.arc(x(li),y(pts[li].scores[k]),4,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=bg||'#182220';ctx.lineWidth=2;ctx.stroke();
  });
  // direct labels at line ends, nudged apart
  const ends=S.players.map((p,k)=>({k,y:y(pts[n-1].scores[k])})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<14)ends[i].y=ends[i-1].y+14;
  ctx.textAlign='left';ctx.font='600 12px "IBM Plex Sans KR",system-ui,sans-serif';
  ends.forEach(e=>{ctx.fillStyle='#ECE6D6';ctx.fillText(S.players[e.k].name.slice(0,6),w-padR+10,e.y)});
  if(hover!=null){
    const pt=pts[hover];const bw=132,bh=18*4+26;let bx=x(hover)+10;if(bx+bw>w-padR)bx=x(hover)-bw-10;const by=padT+4;
    ctx.fillStyle='rgba(15,21,19,.94)';ctx.strokeStyle='rgba(59,82,76,1)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect?ctx.roundRect(bx,by,bw,bh,8):ctx.rect(bx,by,bw,bh);ctx.fill();ctx.stroke();
    ctx.fillStyle='#7F908A';ctx.font='12px "IBM Plex Sans KR",system-ui,sans-serif';ctx.textAlign='left';ctx.fillText(pt.label,bx+10,by+13);
    S.players.forEach((p,k)=>{const yy=by+30+k*18;ctx.fillStyle=SERIES[k];ctx.beginPath();ctx.arc(bx+13,yy,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ECE6D6';ctx.textAlign='left';ctx.fillText(p.name.slice(0,5),bx+22,yy);ctx.textAlign='right';ctx.font='600 12px Rajdhani,"IBM Plex Sans KR",sans-serif';ctx.fillText(String(pt.scores[k]),bx+bw-10,yy);ctx.font='12px "IBM Plex Sans KR",system-ui,sans-serif'});
  }
  return{x,padL,padR,n};
}
function openLog(){
  const pts=chartSeries();

  full('기록',`<div class="chart-wrap"><canvas id="chart"></canvas><div class="lg">${S.players.map((p,k)=>`<span><i style="background:${SERIES[k]}"></i>${esc(p.name)}</span>`).join('')}</div></div>
    <div class="f-foot" style="padding:0"><button class="ghost" data-act="log-img">이미지로 저장</button></div>
    <div>${rows}</div>`,null,{});
  const cv=$('#chart');chartState={pts,hover:null};

  const pick=e=>{const r=cv.getBoundingClientRect();const w=r.width;const {padL,padR,n}=paintGeom(w);const rel=(e.clientX-r.left-padL)/(w-padL-padR);const i=Math.max(0,Math.min(n-1,Math.round(rel*(n-1))));if(chartState.hover!==i){chartState.hover=i;drawChart(cv,pts,i)}};

  ctx.textAlign='left';ctx.font='13px "IBM Plex Sans KR",system-ui,sans-serif';ctx.fillStyle='#7F908A';ctx.fillText('순위',40,y0);ctx.textAlign='right';ctx.fillText('점수',fc?W-260:W-40,y0);if(fc)ctx.fillText('정산',W-40,y0);
  rows.forEach((r,i)=>{const yy=y0+34+i*46;ctx.strokeStyle='rgba(185,194,187,.15)';ctx.beginPath();ctx.moveTo(40,yy+22);ctx.lineTo(W-40,yy+22);ctx.stroke();
    ctx.fillStyle=SERIES[r.i];ctx.beginPath();ctx.arc(52,yy,7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ECE6D6';ctx.textAlign='left';ctx.font='600 20px "IBM Plex Sans KR",system-ui,sans-serif';ctx.fillText(`${r.rank}위  ${name(r.i)}`,72,yy);
    ctx.font='700 26px Rajdhani,"IBM Plex Sans KR",sans-serif';ctx.textAlign='right';ctx.fillStyle='#F5B342';ctx.fillText(String(r.score),fc?W-260:W-40,yy);
    if(fc){ctx.fillStyle=r.pts>0?'#4CB98A':r.pts<0?'#E8553F':'#7F908A';ctx.fillText((r.pts>0?'+':'')+r.pts.toFixed(1),W-40,yy)}});
  const url=cv.toDataURL('image/png');
  try{
    if(navigator.canShare){const blob=await (await fetch(url)).blob();const file=new File([blob],'riichi-score.png',{type:'image/png'});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'리치 점봉판'});return}}
  }catch(e){}
  full('이미지로 저장',`<div class="imgview"><img src="${url}" alt="점수 변동 그래프와 순위"><div class="note">이미지를 길게 눌러 저장하거나 복사하세요.</div></div>`,`<button class="primary" data-act="log">기록으로 돌아가기</button>`,{});
}

/* ---- events ---- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-set],[data-m],[data-us],[data-tab]');
  if(!b)return;
  const segOn=()=>b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  if(b.dataset.tab){settingsTab=b.dataset.tab;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));$('#layer').querySelectorAll('[data-pane]').forEach(pn=>pn.hidden=pn.dataset.pane!==settingsTab);return}
  if(b.dataset.us&&b.tagName==='BUTTON'&&U){const k=b.dataset.us;U.settings[k]=k==='oka'?+b.dataset.v:b.dataset.v;segOn();return}
  if(b.dataset.m&&b.tagName==='BUTTON'&&M){const k=b.dataset.m;M[k]=+b.dataset.v;segOn();syncStateRows();return}
  if(b.dataset.set&&b.tagName==='BUTTON'&&M){const k=b.dataset.set;M.settings[k]=k==='oka'?+b.dataset.v:b.dataset.v;segOn();return}
  const act=b.dataset.act;if(!act)return;
  const v=b.dataset.v!==undefined?+b.dataset.v:null;
  const seat=b.dataset.seat!==undefined?+b.dataset.seat:null;
  switch(act){
    case 'riichi':e.stopPropagation();doRiichi(seat);break;
    case 'pov':break;
    case 'pov-close':closeLayer();break;
    case 'menu':openMenu();break;
    case 'close':if(b.classList.contains('overlay')&&e.target!==b)break;closeLayer();break;
    case 'confirm-ok':{const cb=confirmCb;confirmCb=null;confirmCancelCb=null;closeLayer();if(cb)cb()}break;
    case 'confirm-cancel':{const cc=confirmCancelCb;confirmCb=null;confirmCancelCb=null;if(cc)cc();else closeLayer()}break;
    case 'w-close':askCloseWin();break;
    case 'win':openWin();break;
    case 'win-for':break;
    case 'w-back':goStep(stepInfo().prev);break;
    case 'w-cancel-add':{const last=F.pending.pop();Object.assign(F,last);F.han=0;F.limit=null;F.step='confirm';renderWin()}break;
    case 'w-winner':F.winner=v;if(F.pending.length){F.type='ron';F.loser=F.pending[0].loser}else if(F.loser===v)F.loser=null;nextStep();break;
    case 'w-type':F.type=b.dataset.v;autofill();nextStep();break;
    case 'w-loser':F.loser=v;nextStep();break;
    case 'w-tab':F.tab=b.dataset.v;renderWin();break;
    case 'w-quick':F.han=0;F.limit=null;if(F.type==='ron')F.base=v;else{F.a=v;F.b=b.dataset.b?+b.dataset.b:''}renderWin();break;
    case 'w-han':F.han=v;F.limit=null;autofill();renderWin();break;
    case 'w-limit':F.han=v;F.limit=b.dataset.l;autofill();renderWin();break;
    case 'w-fu':F.fu=v;F.limit=null;autofill();renderWin();break;
    case 'w-next':if(computeWin(F,false).ok)nextStep();break;
    case 'w-add':{F.pending.push(entryOf());F.winner=null;F.han=0;F.limit=null;F.base='';F.a='';F.b='';F.tab='quick';F.type='ron';F.loser=F.pending[0].loser;
      const taken=F.pending.map(w=>w.winner).concat([F.loser]);const rest=[0,1,2,3].filter(i=>!taken.includes(i));
      if(rest.length===1){F.winner=rest[0];F.step='points'}else F.step='winner';renderWin()}break;
    case 'w-confirm':{const wins=F.pending.concat([entryOf()]);if(doHand(wins)&&!S.ended)closeLayer()}break;
    case 'draw':openDraw();break;
    case 'd-tenpai':D.tenpai[v]=!D.tenpai[v];renderDraw();break;
    case 'd-confirm':{const dr=D;closeLayer();doDraw(dr)}break;
    case 'settle':openSettle();break;
    case 'log':openLog();break;
    case 'log-img':exportImage();break;
    case 'm-step':{const inp=$('#layer').querySelector(`[data-mi="${b.dataset.k}"]`);inp.value=Math.max(0,(+inp.value||0)+(+b.dataset.d));updateManualSum()}break;
    case 'settings':openSettings();break;
    case 'settings-save':saveSettings();break;
    case 'restart':confirmDlg('재시작','같은 이름과 규칙으로 모두 25000점, 東1局부터 다시 시작합니다. 현재 기록은 사라집니다.','재시작',()=>{const names=S.players.map(p=>p.name);S=newGame(names,Object.assign({},S.settings));flash=null;save();render();toast('다시 시작했습니다')},true);break;
    case 'exit':confirmDlg('나가기','게임을 끝내고 시작 화면으로 돌아갑니다. 현재 진행 상황과 기록은 사라집니다.','나가기',()=>{const names=S.players.map(p=>p.name);const st=Object.assign({},S.settings);S=newGame(names,st);S.setup=true;U={names:names.slice(),settings:st};flash=null;save();render();openSetup()},true);break;
    case 'setup':readSetup();openSetup();break;
    case 'u-start':applySetup();S.setup=false;U=null;save();render();closeLayer();toast('게임을 시작했습니다');break;
    case 'u-continue':applySetup();save();render();openContinue();break;
    case 'c-start':{applyStateFields();S.setup=false;U=null;S.log=[];log(`진행 중인 게임에서 시작 · ${S.players.map(p=>p.score).join(' / ')}`,null,'start');flash=null;save();render();closeLayer();toast('게임을 시작했습니다')}break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.mp!==undefined){if(M&&M.locked){M.locked.add(+t.dataset.mp);t.classList.remove('auto')}updateManualSum();return}
  if(t.dataset.mi==='kyotaku'){updateManualSum();return}
  if(t.dataset.s==='name'){syncStateRows();return}

});
document.addEventListener('change',e=>{
  const t=e.target;
  if(D&&t.dataset.act==='d-abortive'){D.abortive=t.checked;renderDraw()}
  if(t.dataset.usc==='finalCalc'||t.dataset.setc==='finalCalc'){const g=$('#layer').querySelector('[data-final-group]');if(g)g.hidden=!t.checked}
});
/* drag from a 화료 bar: the screen dims and big drop zones appear — another player = ron on them, the center = tsumo */
let wdrag=null;
function wdragTarget(x,y){
  const el=document.elementFromPoint(x,y);if(!el)return null;
  const z=el.closest('.wzone');if(!z)return null;
  const k=z.dataset.kind;
  return k==='ron'?{kind:'ron',seat:+z.dataset.seat,el:z}:{kind:k,el:z};
}
document.addEventListener('pointerdown',e=>{
  const bar=e.target.closest('.pwb');if(!bar||bar.disabled||S.ended)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();
  wdrag={seat:+bar.dataset.seat,bar,x0:e.clientX,y0:e.clientY,active:false,hov:null,timer:setTimeout(()=>startWdrag(),260)};
});
function startWdrag(){
  if(!wdrag||wdrag.active)return;wdrag.active=true;
  const ov=document.createElement('div');ov.className='wover';const ROT=SEAT_ROT[posOf(wdrag.seat)];
  const B=document.querySelector('.board').getBoundingClientRect();const cell=B.width/3;const IN=Math.max(5,Math.round(cell*0.035));
  const cellRect=(cx,cy,cw=1,chh=1)=>({left:B.left+cx*cell,top:B.top+cy*cell,width:cell*cw,height:cell*chh});
  const CELL={top:[0,0,2,1],right:[2,0,1,2],bottom:[1,2,2,1],left:[0,1,1,2]};
  const zone=(rect,cls,kind,seat,html)=>{const z=document.createElement('div');z.className='wzone '+cls;z.dataset.kind=kind;if(seat!=null)z.dataset.seat=seat;z.style.left=(rect.left+IN)+'px';z.style.top=(rect.top+IN)+'px';z.style.width=(rect.width-IN*2)+'px';z.style.height=(rect.height-IN*2)+'px';z.innerHTML=`<div class="zl" style="transform:rotate(${ROT}deg)">${html}</div>`;ov.appendChild(z)};
  S.players.forEach((p,i)=>{
    const pc=POS_CLASS[posOf(i)],r=cellRect(...CELL[pc]);
    if(i===wdrag.seat)zone(r,'me '+pc,'tsumo',i,`<b>쯔모</b><span>${esc(p.name)} 본인</span>`);
    else zone(r,pc,'ron',i,`<b>론</b><span>${esc(p.name)} 방총</span>`);
  });
  zone(cellRect(1,1),'center','manual',null,`<b>직접 설정</b><span>단계별 입력</span>`);
  document.body.appendChild(ov);wdrag.over=ov;
  const g=document.createElement('div');g.className='dghost';g.textContent=`${name(wdrag.seat)} 화료`;g.style.transform=`translate(-50%,-50%) rotate(${ROT}deg) translateY(-160%)`;document.body.appendChild(g);wdrag.ghost=g;
  moveGhost(wdrag.x0,wdrag.y0);
  if(navigator.vibrate)navigator.vibrate(10);
}
function moveGhost(x,y){if(wdrag&&wdrag.ghost){wdrag.ghost.style.left=x+'px';wdrag.ghost.style.top=y+'px'}}
document.addEventListener('pointermove',e=>{
  if(!wdrag)return;
  if(!wdrag.active&&Math.hypot(e.clientX-wdrag.x0,e.clientY-wdrag.y0)>10){clearTimeout(wdrag.timer);startWdrag()}
  if(!wdrag.active)return;
  moveGhost(e.clientX,e.clientY);
  const t=wdragTarget(e.clientX,e.clientY);const el=t?t.el:null;
  if(el!==wdrag.hov){if(wdrag.hov)wdrag.hov.classList.remove('hov');if(el){el.classList.add('hov');if(navigator.vibrate)navigator.vibrate(6)}wdrag.hov=el}
});
function endWdrag(e){
  if(!wdrag)return;clearTimeout(wdrag.timer);const w=wdrag;wdrag=null;
  const t=(w.active&&e.type==='pointerup')?wdragTarget(e.clientX,e.clientY):null;
  if(w.ghost)w.ghost.remove();if(w.over)w.over.remove();
  if(e.type!=='pointerup')return;
  if(!w.active){openWin();F.winner=w.seat;F.step='type';renderWin();return}
  if(!t)return;
  openWin();F.winner=w.seat;
  if(t.kind==='manual'){F.step='type';renderWin();return}
  if(t.kind==='ron'){F.type='ron';F.loser=t.seat}else{F.type='tsumo'}
  F.step='points';renderWin();
}
document.addEventListener('pointerup',endWdrag);document.addEventListener('pointercancel',endWdrag);
addEventListener('blur',()=>{endWdrag({type:'blur'})});document.addEventListener('visibilitychange',()=>{if(document.hidden)endWdrag({type:'hide'})});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.pwb'))e.preventDefault()});

/* press on a seat: short tap toggles the view, holding shows it until release */
document.addEventListener('pointerdown',e=>{
  const card=e.target.closest('.seat .card');
  if(!card||e.target.closest('[data-act="riichi"]')||(e.pointerType==='mouse'&&e.button!==0))return;
  if(press){clearTimeout(press.timer)}
  const seat=+card.dataset.seat;
  try{card.setPointerCapture(e.pointerId)}catch(_){}
  press={seat,held:false,timer:setTimeout(()=>{if(press){press.held=true;openPov(seat,true)}},HOLD_MS)};
});
function endPress(e){
  if(!press)return;clearTimeout(press.timer);const p=press;press=null;
  if(p.held){if(povSeat===p.seat)closeLayer();return}
  if(e.type!=='pointerup')return;
  if(povSeat===p.seat)closeLayer();else openPov(p.seat,false);
}
document.addEventListener('pointerup',endPress);
document.addEventListener('pointercancel',endPress);
document.addEventListener('contextmenu',e=>{if(e.target.closest('.seat .card'))e.preventDefault()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#layer').innerHTML&&!(S&&S.setup)){if(F&&!confirmCb)askCloseWin();else if(!confirmCb)closeLayer()}});
addEventListener('resize',()=>{if($('#layer').innerHTML)setLayerRot(povSeat!=null?SEAT_ROT[posOf(povSeat)]:0);if(chartState&&$('#chart'))drawChart($('#chart'),chartState.pts,chartState.hover)});

/* ---- init ---- */
S=load();
if(!S){S=newGame(DEFAULT_NAMES.slice(),defaultSettings());S.setup=true}
render();
if(S.setup)openSetup();
})();
</script>
